# A spare host, not a requirement. The live URL is GitHub Pages, built by
# .github/workflows/deploy.yml, and every sponsor prize in this challenge goes
# to the top ten with no obligation to deploy on any particular platform.
#
# No COOP/COEP headers here on purpose. Those are needed only by DuckDB's `coi`
# build, which uses SharedArrayBuffer; this app ships only the exception-handling
# build, so the page runs fine without cross-origin isolation. `npm run
# test:coi` proves that against whatever is deployed.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
